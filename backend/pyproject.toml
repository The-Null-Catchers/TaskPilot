[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskpilot-api"
version = "0.1.0"
description = "TaskPilot backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<24",
  "redis>=5,<6",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.12,<1",
  "boto3>=1.35,<2",
  "Pillow>=10,<13",
  "cryptography>=43,<51",
  "httpx[http2]>=0.27,<1",
  "pywebpush>=2,<3",
  "prometheus-client>=0.21,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/tasks.py" = ["F401"]
