name: TaskPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, migrations, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskpilot
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: taskpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskpilot -d taskpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://taskpilot:taskpilot@localhost:5432/taskpilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-that-is-never-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff check app tests
      - name: Verify migrations from an empty database
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q

  web:
    name: Web lint, test, typecheck, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  flutter:
    name: Flutter analyze, test, and Android builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project without overwriting app sources
        run: |
          flutter create /tmp/taskpilot_host --platforms=android --project-name=taskpilot_mobile --org=dev.taskpilot
          cp -R /tmp/taskpilot_host/android ./android
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_URL=https://api.example.com
      - run: flutter build appbundle --release --dart-define=API_URL=https://api.example.com
      - uses: actions/upload-artifact@v4
        with:
          name: taskpilot-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error


  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config
      - name: Build backend production image
        run: docker build -t taskpilot-backend:ci ./backend
      - name: Build web production image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t taskpilot-web:ci ./web
