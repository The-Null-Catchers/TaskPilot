name: TaskPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, migrations, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskpilot
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: taskpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskpilot -d taskpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://taskpilot:taskpilot@localhost:5432/taskpilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-that-is-never-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff check app tests
      - name: Verify migrations from an empty database
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q

  web:
    name: Web lint, test, typecheck, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  web-e2e:
    name: Web browser E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskpilot
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: taskpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskpilot -d taskpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://taskpilot:taskpilot@localhost:5432/taskpilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: e2e-only-secret-that-is-never-used-in-production
      NOTIFICATION_SECRET: e2e-notification-secret
      INTEGRATION_SECRET: e2e-integration-secret
      CORS_ORIGINS: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: taskpilot-e2e
      STORAGE_KEY: taskpilot
      STORAGE_SECRET: taskpilot-dev-password
      STORAGE_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        working-directory: backend
        run: pip install '.[dev]'
      - name: Start MinIO object storage
        run: |
          docker run --rm -d             --name taskpilot-e2e-minio             -p 9000:9000             -e MINIO_ROOT_USER=taskpilot             -e MINIO_ROOT_PASSWORD=taskpilot-dev-password             quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs taskpilot-e2e-minio
          exit 1
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Start API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/taskpilot-api.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/taskpilot-api.log
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: taskpilot-playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  flutter:
    name: Flutter analyze, test, and Android builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project without overwriting app sources
        run: |
          flutter create /tmp/taskpilot_host --platforms=android --project-name=taskpilot_mobile --org=dev.taskpilot
          cp -R /tmp/taskpilot_host/android ./android
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_URL=https://api.example.com
      - run: flutter build appbundle --release --dart-define=API_URL=https://api.example.com
      - uses: actions/upload-artifact@v7
        with:
          name: taskpilot-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error


  flutter-ios:
    name: Flutter iOS analyze, test, and release build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS host project without overwriting app sources
        run: |
          flutter create /tmp/taskpilot_ios_host --platforms=ios --project-name=taskpilot_mobile --org=dev.taskpilot
          cp -R /tmp/taskpilot_ios_host/ios ./ios
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign --dart-define=API_URL=https://api.example.com
      - uses: actions/upload-artifact@v7
        with:
          name: taskpilot-ios-unsigned
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.prod.yml config
      - name: Validate observability configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          NEXT_PUBLIC_API_URL: https://api.example.com
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: |
          mkdir -p ops/observability/secrets
          printf '%s' 'ci-metrics-token' > ops/observability/secrets/metrics_token
          docker compose -f docker-compose.prod.yml -f ops/observability/docker-compose.observability.yml config
          docker run --rm \
            --entrypoint=/bin/promtool \
            -v "$PWD/ops/observability/prometheus:/etc/prometheus:ro" \
            -v "$PWD/ops/observability/secrets/metrics_token:/run/secrets/taskpilot_metrics_token:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/ops/observability/alloy:/etc/alloy:ro" \
            grafana/alloy:v1.12.0 \
            validate /etc/alloy/config.alloy
          rm -f ops/observability/secrets/metrics_token
      - name: Build backend production image
        run: docker build -t taskpilot-backend:ci ./backend
      - name: Build web production image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.com -t taskpilot-web:ci ./web
